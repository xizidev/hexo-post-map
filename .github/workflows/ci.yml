name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Seal shared candidate tarball
        run: npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        with:
          name: packed-candidate
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 7

  integration:
    needs: checks
    name: Node ${{ matrix.node }} / Hexo ${{ matrix.hexo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        hexo: ['7.1.1', '7.3.0', '8.1.2']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v8
        with:
          name: packed-candidate
          path: ${{ runner.temp }}/hpm-candidate
      - name: Select shared candidate tarball
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; import assert from "node:assert/strict"; const directory = path.join(process.env.RUNNER_TEMP, "hpm-candidate"); const files = fs.readdirSync(directory).filter(name => name.endsWith(".tgz")); assert.equal(files.length, 1); fs.appendFileSync(process.env.GITHUB_ENV, "HPM_PACKED_TARBALL=" + path.join(directory, files[0]) + "\n");'
      - run: npm run test:integration -- --hexo="$HEXO_VERSION"
        env:
          HEXO_VERSION: ${{ matrix.hexo }}

  browser:
    needs: checks
    name: Chromium browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - uses: actions/download-artifact@v8
        with:
          name: packed-candidate
          path: ${{ runner.temp }}/hpm-candidate
      - name: Select shared browser candidate tarball
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; import assert from "node:assert/strict"; const directory = path.join(process.env.RUNNER_TEMP, "hpm-candidate"); const files = fs.readdirSync(directory).filter(name => name.endsWith(".tgz")); assert.equal(files.length, 1); fs.appendFileSync(process.env.GITHUB_ENV, "HPM_PACKED_TARBALL=" + path.join(directory, files[0]) + "\n");'
      - run: npm run test:e2e -- --trace=retain-on-failure
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: chromium-failure-traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
